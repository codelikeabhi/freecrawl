# Fork overrides, merged over docker-compose.yaml automatically by `docker compose`.
# Why each change exists: docs/fork/RECON.md section 4. Keep base-file diffs at zero.

services:
  # ponytail: caps sized for a 12 GB Docker VM (D2: lowered from 16 GB so the
  # host keeps room for the Ollama model) shared with a k3d cluster. Base asks
  # 8g / 4g. Raise if `docker stats` shows them pinned at the cap.
  api:
    restart: unless-stopped  # owner: auto-start with Docker (2026-11-21)
    mem_limit: 6g
    memswap_limit: 6g
    environment:
      # Not in the base x-common-env list, so .env alone would not reach the API.
      PARSE_UPLOAD_REF_SECRET: ${PARSE_UPLOAD_REF_SECRET:-}
      MODEL_CONTEXT_TOKENS: ${MODEL_CONTEXT_TOKENS:-}
      # Firecrawl's Go converter (RobustCodeBlock, GFM tables) is in the image
      # but off by default; without it Turndown drops code fences and escapes
      # code. Cloud converts with the same library.
      USE_GO_MARKDOWN_PARSER: "true"
      # Screenshots and PDFs as files (lib/fork-files.ts), served by `files`.
      FORK_FILES_DIR: /data/files
      FORK_FILES_URL: http://localhost:3010
      FORK_FILES_HOST_DIR: ${FORK_FILES_HOST_DIR:-}
      # Host-native stealth engine (scripts/fork/stealth.sh), PLAN.md Phase 6.
      FORK_STEALTH_URL: ${FORK_STEALTH_URL:-}
      # OCR (PLAN.md Phase 8, D6): our MinerU service speaks FirePDF's /ocr
      # (scripts/fork/ocr.sh). Text-layer PDFs stay on the fast Rust path;
      # only PDFs that need OCR, and images, go to it.
      FIRE_PDF_ENABLE: ${FIRE_PDF_ENABLE:-}
      FIRE_PDF_BASE_URL: ${FIRE_PDF_BASE_URL:-}
      FIRE_PDF_PERCENT: ${FIRE_PDF_PERCENT:-}
      IMAGE_OCR_ENABLED: ${IMAGE_OCR_ENABLED:-}
      PDF_RUST_EXTRACT_ENABLE: ${PDF_RUST_EXTRACT_ENABLE:-}
      PARSE_PDF_ALWAYS_FIRE_PDF: ${PARSE_PDF_ALWAYS_FIRE_PDF:-}
      # Research, developer and gov search (PLAN.md Phase 3b): our `indexes`
      # service speaks both contracts the API forwards to.
      RESEARCH_PROXY_URL: ${RESEARCH_PROXY_URL:-}
      SEARCH_PLATFORM_URL: ${SEARCH_PLATFORM_URL:-}
      # Local state (PLAN.md Phase 10, D10): scrape index in nuq-postgres,
      # documents in fake-gcs, job access/state and change-tracking history
      # in Redis (lib/fork-state.ts). `scripts/fork/state.sh init` once.
      INDEX_DATABASE_URL: ${INDEX_DATABASE_URL:-}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_INDEX_BUCKET_NAME: ${GCS_INDEX_BUCKET_NAME:-}
      FORK_GCS_ENDPOINT: ${FORK_GCS_ENDPOINT:-}
      FORK_LOCAL_STATE: ${FORK_LOCAL_STATE:-}
    volumes:
      - ./data/files:/data/files
    depends_on:
      searxng:
        condition: service_started
  playwright-service:
    restart: unless-stopped  # owner: auto-start with Docker (2026-11-21)
    mem_limit: 3g
    memswap_limit: 3g

  # Named volumes so data survives `docker compose down` / container replacement.
  nuq-postgres:
    restart: unless-stopped  # owner: auto-start with Docker (2026-11-21)
    volumes:
      - nuq-postgres-data:/var/lib/postgresql/data
  redis:
    restart: unless-stopped  # owner: auto-start with Docker (2026-11-21)
    volumes:
      - redis-data:/data
  rabbitmq:
    restart: unless-stopped  # owner: auto-start with Docker (2026-11-21)
    # RabbitMQ names its data dir after the hostname; pin it so the volume is reused.
    hostname: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # Search backend (PLAN.md Phase 3). Backend network only, never published.
  searxng:
    image: searxng/searxng:2026.10.30-ffa88e3ba
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    volumes:
      - ./fork/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - backend
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Research, developer and gov indexes over free public APIs (PLAN.md Phase 3b).
  # Backend network only; calls arXiv, OpenAlex, UniProt, GitHub, Stack
  # Exchange, eCFR and the Federal Register, cached in Redis.
  indexes:
    build: apps/index-service
    environment:
      SEARXNG_URL: http://searxng:8080
      FIRECRAWL_URL: http://api:3002
      REDIS_URL: redis://redis:6379
      # Optional: raises GitHub search from 10 to 30 requests a minute.
      GITHUB_TOKEN: ${FORK_GITHUB_TOKEN:-}
    networks:
      - backend
    mem_limit: 256m
    restart: unless-stopped

  # Stand-in for Google Cloud Storage (PLAN.md Phase 10): scrape results and
  # cached pages, kept in the gcs-data volume. Backend network only.
  fake-gcs:
    image: fsouza/fake-gcs-server:1.56.1
    command: ["-scheme", "http", "-port", "4443", "-backend", "filesystem",
              "-filesystem-root", "/storage", "-public-host", "fake-gcs:4443",
              "-external-url", "http://fake-gcs:4443", "-log-level", "warn"]
    volumes:
      - gcs-data:/storage
    networks:
      - backend
    mem_limit: 256m
    restart: unless-stopped

  # Serves stored screenshots and PDFs (PLAN.md Phase 5). Localhost only, read-only,
  # no directory listing; files have random names and are deleted after 24 h.
  files:
    image: nginx:1.31.7-alpine
    volumes:
      - ./data/files:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:3010:80"
    networks:
      - backend
    mem_limit: 64m
    restart: unless-stopped

  # Default queue is NuQ Postgres; FoundationDB only runs with `--profile fdb`.
  foundationdb:
    profiles: [fdb]
  foundationdb-init:
    profiles: [fdb]

volumes:
  gcs-data:
  nuq-postgres-data:
  redis-data:
  rabbitmq-data:
