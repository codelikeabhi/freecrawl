# Fork overrides, merged over docker-compose.yaml automatically by `docker compose`.
# Why each change exists: docs/fork/RECON.md section 4. Keep base-file diffs at zero.

services:
  # ponytail: caps sized for a 12 GB Docker VM (D2: lowered from 16 GB so the
  # host keeps room for the Ollama model) shared with a k3d cluster. Base asks
  # 8g / 4g. Raise if `docker stats` shows them pinned at the cap.
  api:
    restart: unless-stopped  # owner: auto-start with Docker (2026-11-21)
    mem_limit: 6g
    memswap_limit: 6g
    environment:
      # Not in the base x-common-env list, so .env alone would not reach the API.
      PARSE_UPLOAD_REF_SECRET: ${PARSE_UPLOAD_REF_SECRET:-}
      MODEL_CONTEXT_TOKENS: ${MODEL_CONTEXT_TOKENS:-}
      # Firecrawl's Go converter (RobustCodeBlock, GFM tables) is in the image
      # but off by default; without it Turndown drops code fences and escapes
      # code. Cloud converts with the same library.
      USE_GO_MARKDOWN_PARSER: "true"
      # fork: plain fetch first, browser only for JS shells and blocks (per host)
      FORK_FETCH_FIRST: "true"
      # fork: per-host pacing; 429/503 push the next request back (lib/fork-host-pace.ts)
      FORK_HOST_GAP_MS: "500"
      # Screenshots and PDFs as files (lib/fork-files.ts), served by `files`.
      FORK_FILES_DIR: /data/files
      FORK_FILES_URL: http://localhost:3010
      FORK_FILES_HOST_DIR: ${FORK_FILES_HOST_DIR:-}
      # Host-native stealth engine (scripts/fork/stealth.sh), PLAN.md Phase 6.
      FORK_STEALTH_URL: ${FORK_STEALTH_URL:-}
      # OCR (PLAN.md Phase 8, D6): our MinerU service speaks FirePDF's /ocr
      # (scripts/fork/ocr.sh). Text-layer PDFs stay on the fast Rust path;
      # only PDFs that need OCR, and images, go to it.
      FIRE_PDF_ENABLE: ${FIRE_PDF_ENABLE:-}
      FIRE_PDF_BASE_URL: ${FIRE_PDF_BASE_URL:-}
      FIRE_PDF_PERCENT: ${FIRE_PDF_PERCENT:-}
      IMAGE_OCR_ENABLED: ${IMAGE_OCR_ENABLED:-}
      PDF_RUST_EXTRACT_ENABLE: ${PDF_RUST_EXTRACT_ENABLE:-}
      PARSE_PDF_ALWAYS_FIRE_PDF: ${PARSE_PDF_ALWAYS_FIRE_PDF:-}
      # Research, developer and gov search (PLAN.md Phase 3b): our `indexes`
      # service speaks both contracts the API forwards to.
      RESEARCH_PROXY_URL: ${RESEARCH_PROXY_URL:-}
      SEARCH_PLATFORM_URL: ${SEARCH_PLATFORM_URL:-}
      # Local state (PLAN.md Phase 10, D10): scrape index in nuq-postgres,
      # documents in fake-gcs, job access/state and change-tracking history
      # in Redis (lib/fork-state.ts). `scripts/fork/state.sh init` once.
      INDEX_DATABASE_URL: ${INDEX_DATABASE_URL:-}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_INDEX_BUCKET_NAME: ${GCS_INDEX_BUCKET_NAME:-}
      FORK_GCS_ENDPOINT: ${FORK_GCS_ENDPOINT:-}
      FORK_LOCAL_STATE: ${FORK_LOCAL_STATE:-}
      # Monitors (PLAN.md Phase 12): main DB tables in nuq-postgres
      # (fork/state/monitor.sql); webhooks signed with this secret.
      DATABASE_URL: ${DATABASE_URL:-}
      # Audio, video, YouTube metadata and transcripts (PLAN.md Phase 9).
      AVGRAB_SERVICE_URL: ${AVGRAB_SERVICE_URL:-}
      # redactPII (PLAN.md Phase 11, D7): Presidio behind fire-privacy's /redact.
      FIRE_PRIVACY_URL: ${FIRE_PRIVACY_URL:-}
      # product and menu formats (PLAN.md Phase 13).
      PRODUCT_EXTRACTION_SERVICE_URL: ${PRODUCT_EXTRACTION_SERVICE_URL:-}
      MENU_EXTRACTION_SERVICE_URL: ${MENU_EXTRACTION_SERVICE_URL:-}
      # deterministicJson (PLAN.md Phase 13): the sandbox has no network, so
      # the API reaches it over a Unix socket; codegen uses the local model.
      CODE_SANDBOX_URL: ws+unix:/sandbox/run.sock
      EXTRACT_CODEGEN_MODEL: ${MODEL_NAME:-}
      # Browser sessions and interact (PLAN.md Phase 14): our session service
      # speaks Hangar's contract over a Unix socket (no network path to us).
      HANGAR_URL: http://browser-sessions
      # /v2/agent (PLAN.md Phase 15): our agent service.
      EXTRACT_V3_BETA_URL: http://agent:8080
      AGENT_INTEROP_SECRET: ${AGENT_INTEROP_SECRET:-}
      FORK_HANGAR_SOCKET: /sessions/hangar.sock
      SELF_HOSTED_WEBHOOK_HMAC_SECRET: ${SELF_HOSTED_WEBHOOK_HMAC_SECRET:-}
      # Receivers on the Mac only; scrapes keep the private-address guard.
      FORK_WEBHOOK_LOCAL_HOSTS: host.docker.internal
    volumes:
      - ./data/files:/data/files
      - sandbox-sock:/sandbox
      - sessions-sock:/sessions
    depends_on:
      searxng:
        condition: service_started
  playwright-service:
    restart: unless-stopped  # owner: auto-start with Docker (2026-11-21)
    mem_limit: 3g
    memswap_limit: 3g

  # Named volumes so data survives `docker compose down` / container replacement.
  nuq-postgres:
    restart: unless-stopped  # owner: auto-start with Docker (2026-11-21)
    volumes:
      - nuq-postgres-data:/var/lib/postgresql/data
  redis:
    restart: unless-stopped  # owner: auto-start with Docker (2026-11-21)
    volumes:
      - redis-data:/data
  rabbitmq:
    restart: unless-stopped  # owner: auto-start with Docker (2026-11-21)
    # RabbitMQ names its data dir after the hostname; pin it so the volume is reused.
    hostname: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # Search backend (PLAN.md Phase 3). Backend network only, never published.
  searxng:
    image: searxng/searxng:2026.10.30-ffa88e3ba
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    volumes:
      - ./fork/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - backend
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Research, developer and gov indexes over free public APIs (PLAN.md Phase 3b).
  # Backend network only; calls arXiv, OpenAlex, UniProt, GitHub, Stack
  # Exchange, eCFR and the Federal Register, cached in Redis.
  indexes:
    build: apps/index-service
    environment:
      SEARXNG_URL: http://searxng:8080
      FIRECRAWL_URL: http://api:3002
      REDIS_URL: redis://redis:6379
      # Optional: raises GitHub search from 10 to 30 requests a minute.
      GITHUB_TOKEN: ${FORK_GITHUB_TOKEN:-}
    networks:
      - backend
    mem_limit: 256m
    restart: unless-stopped

  # Browser sessions (PLAN.md Phase 14): runs user and model-driven node/bash
  # code next to a live Chromium, so it is fenced in: an internal network whose
  # only way out is egress-proxy (public addresses only), read-only, non-root,
  # no capabilities. The API reaches it over a Unix socket.
  browser-sessions:
    build: apps/browser-sessions
    environment:
      EGRESS_PROXY: http://egress-proxy:3128
      PUBLIC_CDP_BASE: ws://127.0.0.1:9333
      MAX_SESSIONS: "3"
    networks:
      - sessions
    read_only: true
    tmpfs:
      - /tmp:size=2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 3g
    volumes:
      - sessions-sock:/sessions
      - browser-profiles:/profiles
    restart: unless-stopped

  # The sessions' only exit: HTTP/HTTPS to public addresses, plus the CDP
  # relay published on 127.0.0.1:9333 only.
  egress-proxy:
    build: apps/egress-proxy
    environment:
      SESSIONS_HOST: browser-sessions
    networks:
      - sessions
      - egress
    ports:
      - "127.0.0.1:9333:9333"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    restart: unless-stopped

  # Runs deterministicJson extractors (PLAN.md Phase 13): LLM-written code
  # from untrusted pages, so no network at all, read-only, no capabilities,
  # non-root, capped. Its only door is a Unix socket shared with the API.
  code-sandbox:
    build: apps/code-sandbox
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    volumes:
      - sandbox-sock:/sandbox
    restart: unless-stopped

  # /v2/agent (PLAN.md Phase 15, D8): plan, search, scrape, merge with the
  # local model, through our own API. Backend network only.
  agent:
    build: apps/agent-service
    environment:
      FIRECRAWL_URL: http://api:3002
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      AGENT_INTEROP_SECRET: ${AGENT_INTEROP_SECRET:-}
      SELF_HOSTED_WEBHOOK_HMAC_SECRET: ${SELF_HOSTED_WEBHOOK_HMAC_SECRET:-}
      FORK_WEBHOOK_LOCAL_HOSTS: host.docker.internal
    networks:
      - backend
    mem_limit: 256m
    restart: unless-stopped

  # Product and menu extraction (PLAN.md Phase 13): JSON-LD first, then the
  # host's Ollama model. Backend network only.
  structured:
    build: apps/structured-service
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
    networks:
      - backend
    mem_limit: 256m
    restart: unless-stopped

  # PII redaction (PLAN.md Phase 11): Presidio + spaCy, English. Backend only.
  privacy:
    build: apps/privacy-service
    networks:
      - backend
    mem_limit: 768m
    restart: unless-stopped

  # Media (PLAN.md Phase 9): yt-dlp behind avgrab's contract. Writes files to
  # ./data/files (served by `files`, deleted after 24 h). Backend network only.
  media:
    build: apps/media-service
    environment:
      FILES_DIR: /data/files
      FILES_URL: http://localhost:3010
    volumes:
      - ./data/files:/data/files
    networks:
      - backend
    mem_limit: 1g
    restart: unless-stopped

  # Stand-in for Google Cloud Storage (PLAN.md Phase 10): scrape results and
  # cached pages, kept in the gcs-data volume. Backend network only.
  fake-gcs:
    image: fsouza/fake-gcs-server:1.56.1
    command: ["-scheme", "http", "-port", "4443", "-backend", "filesystem",
              "-filesystem-root", "/storage", "-public-host", "fake-gcs:4443",
              "-external-url", "http://fake-gcs:4443", "-log-level", "warn"]
    volumes:
      - gcs-data:/storage
    networks:
      - backend
    mem_limit: 256m
    restart: unless-stopped

  # Serves stored screenshots and PDFs (PLAN.md Phase 5). Localhost only, read-only,
  # no directory listing; files have random names and are deleted after 24 h.
  files:
    image: nginx:1.31.7-alpine
    volumes:
      - ./data/files:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:3010:80"
    networks:
      - backend
    mem_limit: 64m
    restart: unless-stopped

  # Default queue is NuQ Postgres; FoundationDB only runs with `--profile fdb`.
  foundationdb:
    profiles: [fdb]
  foundationdb-init:
    profiles: [fdb]

volumes:
  browser-profiles:
  sessions-sock:
  gcs-data:
  sandbox-sock:
  nuq-postgres-data:
  redis-data:
  rabbitmq-data:

networks:
  # Browser sessions: no route out except egress-proxy.
  sessions:
    internal: true
  egress:
